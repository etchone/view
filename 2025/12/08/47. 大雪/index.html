      <p>列车呼啸而过。</p>
<p>风扯动干涸的芦苇，<br>碎屑团团散落。</p>
<p>黄沙，烟尘。<br>荒漠。</p>
<p>朽木杂乱地堆在一起，<br>铰链铜线盘根错节。</p>
<p>道闸杆插在路旁，<br>流出腐朽的空壳。</p>
<p>折断的指示牌上，<br>秃鹫打量着脚下的活物。</p>
<p>沙蜥眺望着远方。</p>
<p>红日灼烧着地平线。</p>
<p>生机勃勃。</p>
