    <div class="post-content">
      <p>闪电。</p>
<p>雨水砸在地上，溅起细密的涟漪。</p>
<p>街道上挤满了人和车。</p>
<p>路口红灯亮起，宣告他们无法前进。</p>
<p>天空中乌云密布。</p>
<p>飞溅的雨滴让街上泛起了一层雾。</p>
<p>街灯将雾染成了各种颜色。</p>
<p>人们的手机泛着白光。</p>
<p>嘈杂。</p>
<p>雨珠四处飞溅。</p>
<p>车轮碾过水坑，掀起半米高的巨浪。</p>
<p>电车经过，车铃响起。</p>
<p>雷声轰鸣。</p>
<p>人们在回家的路上。</p>
