      <p>夏夜的风也是暖的</p>
<p>风拂着湖面</p>
<p>将夜灯拉成一条条线</p>
<p>有光的地方，人们骑着单车</p>
<p>由远，及近，又远去</p>
<p>三三两两</p>
<p>谈笑着，讨论着</p>
<p>也有落单的影子</p>
<p>一言不发</p>
<p>只是静静地移动着</p>
<p>玻璃幕墙顶，障碍灯闪着</p>
<p>一亮，一灭</p>
<p>一亮，一灭</p>
<p>河流经过湖泊</p>
<p>继续向下游流去</p>
<p>夏夜的风也是暖的</p>
<p>时间不早了，回去吧</p>
