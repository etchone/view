      <p>宽广的河旁是我们不朽的王<br>他只身一人留在这座城邦<br>护城的河面舳舻千里<br>船帆熙来攘往</p>
<p>古老的城里是我们不朽的王<br>他孤身一人守护这座城邦<br>城楼远望视野辽阔<br>城邦固若金汤</p>
<p>辉煌的殿内是我们不朽的王<br>宫殿有七尺基台须弥座<br>柱高一丈，檐出三尺<br>殿内冬暖夏凉</p>
<p>华美的座上是我们不朽的王<br>藤蔓攀附着他枯槁的臂膀<br>​他未垂下他的头颅<br>​我们不朽的王</p>
