<blockquote>
<p>愿闻君之所言</p>
</blockquote>
<p>“在被遗忘的过去<br>有一片无人的荒野<br>长满未被赠与的花<br>与未被看见的你</p>
<p>“你在那里驻足歇息<br>你在那里蒙眼藏匿<br>直到来路长满荆棘<br>直到世界销声匿迹</p>
<p>“但在那荒野的尽头<br>会有一株新芽破土<br>以你旧日的模样命名<br>向着未来的天空探去</p>
<p>“当那抹嫩绿映入你的眼底<br>当千座城池在你体内奠基<br>你会仰起低垂的头颅<br>你会听见万物的轻语”</p>
