    <h1 class="post-title">秋</h1>

  <div class="post-body-wrapper">
    <div class="post-content">
      <p>日暮落，夜幕升<br>一牙弯月藏在云上<br>半遮帘，窥着世间</p>
<p>湖岸的街灯环成了圆<br>灯下的影子忽明忽暗<br>烛光在水上静静颤<br>夜风将书页轻轻翻</p>
<p>蟋蟀奏起序曲的夜晚<br>鱼鳞拍碎平静的水面<br>鞋边撒满迟谢的花瓣<br>廊桥揽过秋夜的微寒</p>
<p>落花已沉泥，晚风又叩岸<br>独对茶半盏，廊外月如烟</p>
