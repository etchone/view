<li>无风而起</li>
</ol>
<p>似云烟聚集 忽得一场甘雨<br>点点滴滴<br>跌入湖泊 泛起圈圈涟漪<br>润湿大地<br>聚为江河 汇入无垠海里</p>
<blockquote>
<p>这场雨<br>终将会平息</p>
</blockquote>
<ol start="2">
<li>无疾而终</li>
</ol>
<p>如巍巍群峰 散开一缕清风<br>叮叮咚咚<br>穿过云层 带着声声晨钟<br>白发老翁<br>微阖双眼 望向金黄苍穹</p>
<blockquote>
<p>这缕风<br>消散在风中</p>
</blockquote>
