    <div class="post-content">
      <p>它诞生自无解的棋局<br>承载了千万着的希冀<br>它继承于纯白的魂灵<br>背负着十三铢的痼疾</p>
<p>它流放自生命的源地<br>那抹绿色挣扎着隐匿<br>它穿行在无机的森林<br>坠落繁星献上注目礼</p>
<p>它暂驻于人造的晨曦<br>摘取几颗金黄的琉璃<br>它暂驻于无主的禁地<br>留下一道明红的痕迹</p>
<p>它将去往虚无的裂隙<br>昏暗将点燃所有追忆<br>它将去往时间的河底<br>寂静将还它一双羽翼</p>
