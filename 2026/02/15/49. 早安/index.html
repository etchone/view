    <h1 class="post-title">早安</h1>
    <div class="post-meta">

  <div class="post-body-wrapper">
    <div class="post-content">
      <p>一个平凡的早晨<br>你从沉眠中睁开双眼<br>透过澄蓝的玻璃<br>一缕阳光洒在脚边</p>
<p>窗外的绿植们<br>跨过了昨夜漫长的黑暗<br>叶子上留下的几颗露水<br>像绿宝石一般璀璨</p>
<p>尚未消散的梦里<br>你仍掌着一叶小船<br>飘荡在无尽的大海上<br>怎么也找不到对岸</p>
<p>缓缓推开窗户<br>略带寒意的一阵微风<br>轻拂过银质的风铃<br>诉说着往日的云烟</p>
<p>从卧室的门缝外<br>隐隐飘入了一丝清甜<br>而又混着麦香的早安</p>
<p>推开门，你好，今天</p>
