      <p>他攀上那座陡峭的山巅<br>烈风把名字吹成旗幡</p>
<p>人们齐声颂赞：<br>“可敬！可歌！可贺！”<br>以华美的词藻铸造棘冠</p>
<p>他跌入那条无声的深涧<br>厚尘把呼救埋入残烟</p>
<p>人们低头扼腕：<br>“可悲！可哀！可叹！”<br>以怜悯的清泪编织金线</p>
<p>神坛与祭坛，共享一圈围栏<br>围栏年年加高，香火岁岁不断<br>栏外，他们在敬他们的明天</p>
