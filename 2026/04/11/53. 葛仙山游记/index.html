      <p>八一桥头望启明，葛仙山里寻长庚<br>青石幽巷笼微雨，火树银花散流星<br>灯影摇曳金镜醒，烟花乍鸣玉衡惊<br>&#x2F;&#x2F;凡者引路祛邪陌，仙翁赐福佑龙精<br>凡者镇物祛邪陌，仙翁壶火佑龙精&#x2F;&#x2F;暖寒城</p>
<blockquote>
<p>他说<br>“来吧<br>升起手中的心愿<br>我将赐予你们<br>铺满山崖的繁星”</p>
</blockquote>
